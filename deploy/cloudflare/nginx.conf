worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # Cloudflare Tunnel reaches this loopback-only listener. Host networking is
    # deliberate: the existing Blind origin is also loopback-only on :7401.
    server {
        listen 127.0.0.1:7410 default_server;
        server_name _;

        location = /_gateway_health {
            access_log off;
            return 204;
        }

        location / { return 404; }
    }

    server {
        listen 127.0.0.1:7410;
        server_name blind-test.deepshape.dev;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Relay owns only its SSO endpoints. They must be reachable before a
        # session exists, so this location intentionally has no auth_request.
        location /sso/ {
            proxy_pass http://127.0.0.1:7412;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /_sso_verify {
            internal;
            proxy_pass http://127.0.0.1:7412/sso/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }

        location @sso_login {
            return 302 https://blind-test.deepshape.dev/sso/login?rd=https://blind-test.deepshape.dev$request_uri;
        }

        # Owner-only operations remain unreachable even after SSO.
        location /api/v1/control/ { return 404; }
        location = /api/v1/scenes { return 404; }

        # Preserve existing Blind CLI registrations when the production
        # hostname moves behind SSO. Each route enforces Blind's invitation or
        # client credential; no browser session is accepted as a substitute.
        location = /api/v1/health { proxy_pass http://127.0.0.1:7401; }
        location = /api/v1/clients/join { proxy_pass http://127.0.0.1:7401; }
        location = /api/v1/client { proxy_pass http://127.0.0.1:7401; }
        location = /api/v1/client/activate { proxy_pass http://127.0.0.1:7401; }
        location = /api/v1/client/revoke { proxy_pass http://127.0.0.1:7401; }
        location = /api/v1/client/scenes { proxy_pass http://127.0.0.1:7401; }

        location / {
            auth_request /_sso_verify;
            error_page 401 = @sso_login;

            auth_request_set $sso_user $upstream_http_x_sso_user;
            auth_request_set $sso_email $upstream_http_x_sso_email;
            proxy_set_header X-SSO-User $sso_user;
            proxy_set_header X-SSO-Email $sso_email;

            proxy_pass http://127.0.0.1:7401;
        }
    }

    # The CLI cannot complete browser SSO. This separate hostname exposes only
    # registration/client endpoints, which still require Blind's own one-time
    # invite or per-client credential. Viewer and owner endpoints are absent.
    server {
        listen 127.0.0.1:7410;
        server_name blind-api-test.deepshape.dev;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location = /api/v1/health {
            proxy_pass http://127.0.0.1:7401;
        }
        location = /api/v1/clients/join {
            proxy_pass http://127.0.0.1:7401;
        }
        location = /api/v1/client {
            proxy_pass http://127.0.0.1:7401;
        }
        location = /api/v1/client/activate {
            proxy_pass http://127.0.0.1:7401;
        }
        location = /api/v1/client/revoke {
            proxy_pass http://127.0.0.1:7401;
        }
        location = /api/v1/client/scenes {
            proxy_pass http://127.0.0.1:7401;
        }
        location / { return 404; }
    }
}
