name: blind-cloudflare

services:
  gateway:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    user: "101:101"
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7410/_gateway_health"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  sso:
    image: blind-sso-relay:e369f1fdce5b
    restart: unless-stopped
    network_mode: host
    environment:
      RELAY_ADDR: 127.0.0.1:7412
      RELAY_DB: /app/data/relay.db
      RELAY_SECRET: ${RELAY_SECRET:-}
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:-}
      RELAY_GITHUB_TOKEN: sso-only-no-github-access
      INGEST_SCRIPT: /bin/true
      SSO_ENABLED: "true"
      SSO_PROVIDER: ${SSO_PROVIDER:-mock}
      SSO_COOKIE_DOMAIN: .deepshape.dev
      SSO_COOKIE_SECURE: "true"
      SSO_SESSION_TTL: 8h
      SSO_SELF_BASE_URL: https://blind-test.deepshape.dev
      SSO_ALLOWED_RD_SUFFIX: .deepshape.dev
      SSO_FEISHU_APP_ID: ${SSO_FEISHU_APP_ID:-}
      SSO_FEISHU_APP_SECRET: ${SSO_FEISHU_APP_SECRET:-}
      SSO_FEISHU_TENANT_KEY: ${SSO_FEISHU_TENANT_KEY:-}
    volumes:
      - sso-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7412/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    profiles: ["tunnel"]
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:-}"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      gateway:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sso-data:
