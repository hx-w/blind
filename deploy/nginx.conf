# Use the existing wildcard certificate and its existing automatic renewal hook.
server {
    listen 80;
    server_name blind.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name blind.example.com;
    ssl_certificate /etc/letsencrypt/live/blind.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blind.example.com/privkey.pem;

    # These local-owner operations are never exposed through the public proxy.
    location /api/v1/control/ { return 404; }
    location = /api/v1/scenes { return 404; }
    location / {
        proxy_pass http://127.0.0.1:7401;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # Never let Nginx spill original geometry responses to disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}
