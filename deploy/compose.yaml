services:
  blind:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BLIND_UID: "${BLIND_UID:-1000}"
        BLIND_GID: "${BLIND_GID:-1000}"
    image: blind:local
    restart: unless-stopped
    user: "${BLIND_UID:-1000}:${BLIND_GID:-1000}"
    ports:
      - "127.0.0.1:7401:7400"
    volumes:
      - ./config:/config
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 4
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
