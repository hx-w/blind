<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#292c32" />
    <meta name="color-scheme" content="dark light" />
    <title>Blind</title>
  </head>
  <body>
    <a class="skip-link" href="#viewer">跳到 3D 视图</a>
    <div class="app-shell" id="app-shell">
      <header class="topbar" aria-label="场景操作">
        <div class="top-actions" data-viewer-chrome data-label-obstacle>
          <button class="icon-button share-button" id="share-view" type="button" aria-label="分享当前场景">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 8l4-4 4 4"/><path d="M5 12v7h14v-7"/></svg>
          </button>
          <button class="icon-button" id="fullscreen" type="button" aria-label="进入全屏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
          </button>
        </div>
      </header>

      <main id="viewer" class="viewer" tabindex="-1">
        <div id="canvas-root" class="canvas-root" aria-label="可交互 3D 场景"></div>
        <canvas id="markup-canvas" class="markup-canvas" aria-label="屏幕批注画布" aria-hidden="true"></canvas>
        <button id="scene-notice" class="scene-notice" type="button" hidden data-viewer-chrome data-label-obstacle aria-label="查看场景异常详情"></button>
        <div class="gesture-hint" id="gesture-hint" role="status" data-viewer-chrome><span>单指旋转</span><i></i><span>双指移动</span><i></i><span>捏合缩放</span></div>
        <div class="loading-state" id="loading-state">
          <span class="loading-spinner" aria-hidden="true"></span>
          <p id="loading-title">正在读取场景</p>
          <div class="loading-meter" id="loading-meter" role="progressbar" aria-label="LOD 加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i id="loading-bar"></i></div>
          <small id="loading-progress">正在验证源 Mesh</small>
        </div>
        <div class="invalid-state" id="invalid-state" hidden>
          <span class="invalid-code">410</span><h2>场景已失效</h2><p>一个或多个源 Mesh 已被删除、修改或无法读取。</p>
        </div>
        <div class="empty-state" id="empty-state" hidden>
          <h2>没有可打开的场景</h2><p>在终端运行 <code>blind share model.ply</code> 获取查看链接。</p>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </main>

      <nav class="review-dock" aria-label="查看工具" data-viewer-chrome data-label-obstacle>
        <button class="dock-tool" id="fit-view" type="button" aria-label="适配全部可见元素">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/><circle cx="12" cy="12" r="2.5"/></svg><span>Fit</span>
        </button>
        <button class="dock-tool panel-trigger" type="button" aria-label="打开元素详情" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>详情</span>
        </button>
        <button class="dock-tool" id="brush-tool" type="button" aria-label="进入标注模式" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5.5 4 4L9 19l-5 1 1-5 9.5-9.5Z"/><path d="m12.5 7.5 4 4"/></svg><span>标注</span>
        </button>
        <button class="dock-tool" id="scene-info-toggle" type="button" aria-label="打开场景信息" aria-expanded="false" aria-controls="control-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/></svg><span>信息</span>
        </button>
      </nav>

      <aside class="control-panel" id="control-panel" aria-hidden="true" aria-labelledby="panel-title" inert>
        <div class="panel-drag-zone" id="panel-drag-zone" role="button" tabindex="0" aria-label="调整面板高度"><div class="panel-handle" aria-hidden="true"></div></div>
        <div class="panel-heading"><h2 id="panel-title">详情</h2><span id="panel-context"></span>
          <button class="close-panel" id="close-panel" type="button" aria-label="关闭面板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </div>
        <div class="panel-scroll" id="panel-scroll">
          <section class="scene-info" id="scene-info" hidden>
            <div class="scene-info-scroll" tabindex="0" role="region" aria-label="场景说明">
              <h1 id="scene-title">Blind</h1>
            </div>
            <p id="scene-meta">正在读取场景</p>
          </section>
          <section id="mesh-controls">
            <label class="mesh-picker" for="detail-mesh-select"><span>当前元素</span><select id="detail-mesh-select" aria-label="选择要编辑的元素"></select></label>
            <div class="mesh-summary">
              <span class="mesh-summary-dot" id="mesh-summary-dot"></span>
              <span class="mesh-summary-copy"><strong id="mesh-summary-name"></strong><small id="mesh-summary-meta"></small></span>
            </div>
            <div class="mesh-label-editor" data-geometry-only>
              <label class="setting-label" for="mesh-label-text">对象标签</label>
              <input id="mesh-label-text" type="text" maxlength="120" placeholder="例如：供体 A · 真实牙冠" autocomplete="off" aria-describedby="mesh-label-help" />
              <p id="mesh-label-help">随模型显示，分享时保存。清空文字可移除。</p>
            </div>
            <div class="style-section" data-geometry-only><span class="setting-label">精度</span><div class="segmented quality-segmented" aria-label="Mesh 精度">
              <button class="active" data-quality="lod" type="button">LOD</button><button data-quality="raw" type="button">Raw</button>
            </div><p class="lod-saving" id="lod-saving" aria-live="polite"></p></div>
            <div class="style-section color-section" data-geometry-only><span class="setting-label">颜色</span><div class="color-swatches" id="color-swatches" aria-label="Mesh 颜色"></div></div>
            <div class="opacity-controls">
              <div class="opacity-heading">
                <label class="setting-label" for="opacity-range">透明度</label>
                <label class="mesh-visibility"><span>显示</span><input id="mesh-visible-toggle" type="checkbox" checked/><i aria-hidden="true"></i></label>
              </div>
              <div class="range-row"><input id="opacity-range" type="range" min="0" max="100" value="100"/><output id="opacity-value" for="opacity-range">100%</output></div>
            </div>
            <div class="style-section" data-geometry-only><span class="setting-label">表面</span><div class="segmented segmented-three" aria-label="着色方式">
              <button data-shading="smooth" type="button">平滑</button><button class="active" data-shading="flat" type="button">平面</button><button data-shading="wire" type="button">线框</button>
            </div></div>
            <div class="style-section"><span class="setting-label">投影</span><div class="segmented" aria-label="投影方式">
              <button class="active" data-projection="perspective" type="button">透视</button><button data-projection="orthographic" type="button">正交</button>
            </div></div>
            <div class="style-section scene-settings"><span class="setting-label">场景</span><div class="toggle-grid">
              <label><span>坐标轴</span><input id="axes-toggle" type="checkbox" checked/><i></i></label>
              <label><span>浅色背景</span><input id="light-toggle" type="checkbox"/><i></i></label>
            </div></div>
          </section>
        </div>
      </aside>
    </div>

    <dialog class="share-sheet" id="share-sheet">
      <div class="share-grabber"></div>
      <div class="share-heading">
        <button class="share-back" id="back-host" type="button" aria-label="返回分享" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <h2 id="share-title">分享</h2>
        <button id="close-share" type="button" aria-label="关闭分享"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
      </div>
      <div class="share-options">
        <button class="share-host-trigger" id="share-host-trigger" type="button" aria-haspopup="true" aria-expanded="false">
          <span><small>链接地址</small><strong id="share-host-current"></strong></span>
          <svg class="share-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button data-copy="view" type="button"><span class="share-option-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/></svg></span><span><strong>视角链接</strong><small>当前布局、视角、显隐与标记</small></span><svg class="share-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <button data-copy="image" type="button"><span class="share-option-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3"/></svg></span><span><strong>图片链接</strong><small>当前场景的 PNG，包含可见组件</small></span><svg class="share-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <button data-copy="full" id="copy-full" type="button"><span class="share-option-icon"><svg viewBox="0 0 24 24"><path d="M8 4h8l3 3v13H8z"/><path d="M16 4v4h4M11 12h5M11 16h5"/></svg></span><span><strong>完整信息</strong><small>Mesh 路径与两个链接</small></span><svg class="share-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="share-host-picker" id="share-host-picker" hidden>
        <p>选择复制内容使用的地址</p>
        <div class="share-host-list" id="share-host-list" role="radiogroup" aria-label="分享链接地址"></div>
      </div>
      <div class="manual-copy" id="manual-copy" hidden>
        <p><strong>需要手动复制</strong><span>当前连接不允许浏览器自动写入剪贴板。内容已全选，请长按并选择“复制”。</span></p>
        <textarea id="manual-copy-value" readonly aria-label="待复制内容"></textarea>
        <div><button id="select-copy" type="button">重新全选</button><button id="back-share" type="button">返回</button></div>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
