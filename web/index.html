<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#292c32" />
    <meta name="color-scheme" content="dark light" />
    <title>Blind</title>
  </head>
  <body>
    <a class="skip-link" href="#viewer">跳到 3D 视图</a>
    <div class="app-shell" id="app-shell">
      <header class="topbar" aria-label="场景操作">
        <div class="top-actions" data-viewer-chrome data-label-obstacle></div>
      </header>

      <main id="viewer" class="viewer" tabindex="-1">
        <div id="canvas-root" class="canvas-root" aria-label="可交互 3D 场景"></div>
        <canvas id="markup-canvas" class="markup-canvas" aria-label="屏幕批注画布" aria-hidden="true"></canvas>
        <button id="scene-notice" class="scene-notice" type="button" hidden data-viewer-chrome data-label-obstacle aria-label="查看场景异常详情"></button>
        <div class="gesture-hint" id="gesture-hint" role="status" data-viewer-chrome><span>单指旋转</span><i></i><span>双指移动</span><i></i><span>捏合缩放</span></div>
        <div class="loading-state" id="loading-state">
          <span class="loading-spinner" aria-hidden="true"></span>
          <p id="loading-title">正在读取场景</p>
          <div class="loading-meter" id="loading-meter" role="progressbar" aria-label="LOD 加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i id="loading-bar"></i></div>
          <small id="loading-progress">正在验证源 Mesh</small>
        </div>
        <div class="invalid-state" id="invalid-state" hidden>
          <span class="invalid-code">410</span><h2>场景已失效</h2><p>一个或多个源 Mesh 已被删除、修改或无法读取。</p>
        </div>
        <div class="empty-state" id="empty-state" hidden>
          <h2>没有可打开的场景</h2><p>在终端运行 <code>blind share model.ply</code> 获取查看链接。</p>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </main>

      <nav class="review-dock" aria-label="查看工具" data-viewer-chrome data-label-obstacle>
        <div class="dock-page dock-main is-current" aria-label="主工具栏">
        <button class="dock-tool" id="fit-view" type="button" aria-label="适配全部可见元素">
          <i data-lucide="focus" aria-hidden="true"></i><span>适配</span>
        </button>
        <button class="dock-tool" id="observe-trigger" type="button" aria-label="打开观察工具" aria-expanded="false" aria-controls="observe-tools">
          <i data-lucide="scan-eye" aria-hidden="true"></i><span>观察</span>
        </button>
        <button class="dock-tool" id="brush-tool" type="button" aria-label="进入标注模式" aria-pressed="false">
          <i data-lucide="pen-line" aria-hidden="true"></i><span>标注</span>
        </button>
        <button class="dock-tool" id="share-view" type="button" aria-label="分享当前场景">
          <i data-lucide="share-2" aria-hidden="true"></i><span>分享</span>
        </button>
        </div>
        <div class="dock-page dock-observe" id="observe-tools" aria-label="观察工具栏" aria-hidden="true" inert>
          <div class="observe-primary">
            <button class="dock-tool dock-back" id="observe-back" type="button" aria-label="返回主工具栏"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
            <button class="dock-tool observe-category" data-observe-category="shading" type="button" aria-expanded="false" aria-controls="observe-shading"><i data-lucide="paintbrush" aria-hidden="true"></i><span>着色</span></button>
            <button class="dock-tool observe-category" data-observe-category="light" type="button" aria-expanded="false" aria-controls="observe-light"><i data-lucide="lightbulb" aria-hidden="true"></i><span>光照</span></button>
            <button class="dock-tool observe-category" data-observe-category="projection" type="button" aria-expanded="false" aria-controls="observe-projection"><i data-lucide="box" aria-hidden="true"></i><span>投影</span></button>
            <button class="dock-tool observe-category" data-observe-category="scene" id="observe-scene-trigger" type="button" aria-expanded="false" aria-controls="render-controls"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>场景</span></button>
            <button class="dock-tool observe-section" id="section-trigger" type="button" aria-label="划线观察剖面" aria-expanded="false"><i data-lucide="scan-line" aria-hidden="true"></i><span>剖面</span></button>
          </div>
          <div class="observe-setting-group observe-detail" id="observe-shading" role="group" aria-label="着色方式" hidden>
            <button data-shading="smooth" type="button">平滑</button><button data-shading="flat" type="button">平面</button><button data-shading="wire" type="button">线框</button>
          </div>
          <div class="observe-mode-group observe-detail" id="observe-light" role="group" aria-label="光照方式" hidden>
              <button class="dock-tool" data-observe-mode="matte" type="button" aria-label="无影灯观察"><i data-lucide="sun" aria-hidden="true"></i><span>无影灯</span></button>
              <button class="dock-tool" data-observe-mode="raking" type="button" aria-label="掠射光观察"><i data-lucide="flashlight" aria-hidden="true"></i><span>掠射光</span></button>
              <button class="dock-tool" data-observe-mode="normals" type="button" aria-label="法线观察"><i data-lucide="axis-3d" aria-hidden="true"></i><span>法线</span></button>
          </div>
          <div class="observe-setting-group observe-detail" id="observe-projection" role="group" aria-label="投影方式" hidden>
            <button data-projection="perspective" type="button">透视</button><button data-projection="orthographic" type="button">正交</button>
          </div>
          <div class="observe-settings observe-detail" id="render-controls" role="group" aria-label="场景设置" hidden>
            <div class="observe-setting-group observe-scene-group" role="group" aria-label="场景">
              <label title="坐标轴"><span>坐标轴</span><input id="axes-toggle" type="checkbox" role="switch" aria-label="坐标轴"/><b class="observe-switch" aria-hidden="true"></b></label>
              <label title="浅色背景"><span>浅色背景</span><input id="light-toggle" type="checkbox" role="switch" aria-label="浅色背景"/><b class="observe-switch" aria-hidden="true"></b></label>
            </div>
          </div>
          <div id="light-controls" class="observe-light-controls" hidden>
            <label for="light-azimuth">水平 <output id="light-azimuth-value">45°</output><input id="light-azimuth" type="range" min="-180" max="180" value="45" /></label>
            <label for="light-elevation">高度 <output id="light-elevation-value">20°</output><input id="light-elevation" type="range" min="0" max="90" value="20" /></label>
            <label for="light-intensity">强度 <output id="light-intensity-value">100%</output><input id="light-intensity" type="range" min="0" max="200" value="100" /></label>
          </div>
        </div>
      </nav>

      <div id="scene-panels" class="scene-panels"></div>
      <section class="scene-info" id="scene-info" hidden>
        <div class="scene-info-scroll" tabindex="0" role="region" aria-label="场景说明">
          <h1 id="scene-title">Blind</h1>
        </div>
        <div class="scene-selected-info" id="scene-selected-info">
          <span>已选</span><strong id="scene-selected-label"></strong><small id="scene-selected-meta"></small>
        </div>
        <div class="scene-info-quality" id="scene-info-quality" hidden>
          <span>精度</span><div class="segmented quality-segmented" aria-label="Mesh 精度">
            <button class="active" data-quality="lod" type="button">LOD</button><button data-quality="raw" type="button">Raw</button>
          </div><p class="lod-saving" id="lod-saving" aria-live="polite"></p>
        </div>
        <p id="scene-meta">正在读取场景</p>
      </section>
    </div>

    <dialog class="share-sheet" id="share-sheet">
      <div class="share-grabber"></div>
      <div class="share-heading">
        <button class="share-back" id="back-host" type="button" aria-label="返回分享" hidden><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <h2 id="share-title">分享</h2>
        <button id="close-share" type="button" aria-label="关闭分享"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div class="share-options">
        <button class="share-host-trigger" id="share-host-trigger" type="button" aria-haspopup="true" aria-expanded="false">
          <span><small>链接地址</small><strong id="share-host-current"></strong></span>
          <i class="share-chevron" data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
        <button data-copy="view" type="button"><span class="share-option-icon"><i data-lucide="link-2" aria-hidden="true"></i></span><span><strong>视角链接</strong><small>当前布局、视角、显隐与标记</small></span><i class="share-chevron" data-lucide="chevron-right" aria-hidden="true"></i></button>
        <button data-copy="image" type="button"><span class="share-option-icon"><i data-lucide="image" aria-hidden="true"></i></span><span><strong>图片链接</strong><small>当前场景的 PNG，包含可见组件</small></span><i class="share-chevron" data-lucide="chevron-right" aria-hidden="true"></i></button>
        <button data-copy="full" id="copy-full" type="button"><span class="share-option-icon"><i data-lucide="file-text" aria-hidden="true"></i></span><span><strong>完整信息</strong><small>Mesh 路径与两个链接</small></span><i class="share-chevron" data-lucide="chevron-right" aria-hidden="true"></i></button>
      </div>
      <div class="share-host-picker" id="share-host-picker" hidden>
        <p>选择复制内容使用的地址</p>
        <div class="share-host-list" id="share-host-list" role="radiogroup" aria-label="分享链接地址"></div>
      </div>
      <div class="manual-copy" id="manual-copy" hidden>
        <p><strong>需要手动复制</strong><span>当前连接不允许浏览器自动写入剪贴板。内容已全选，请长按并选择“复制”。</span></p>
        <textarea id="manual-copy-value" readonly aria-label="待复制内容"></textarea>
        <div><button id="select-copy" type="button">重新全选</button><button id="back-share" type="button">返回</button></div>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
