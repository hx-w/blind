[package]
name = "blind"
version = "0.17.0"
edition = "2024"
rust-version = "1.85"
description = "Instant local geometry review from any device"
license = "MIT"
repository = "https://github.com/hx-w/blind"
homepage = "https://github.com/hx-w/blind"
readme = "README.md"
keywords = ["mesh", "viewer", "ply", "stl", "obj"]
categories = ["command-line-utilities", "visualization"]
include = [
    "/src/**",
    "/shaders/**",
    "/assets/fonts/**",
    "/web/dist/**",
    "/tests/fixtures/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/docs/**",
]
build = "build.rs"

[[bin]]
name = "blind"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1.12"
bytemuck = { version = "1.21", features = ["derive"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
flate2 = "1.1"
fontdue = "0.9.4"
futures-util = "0.3"
glam = { version = "0.29", features = ["bytemuck"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
mime_guess = "2.0"
meshopt = "0.6.2"
object_store = { version = "0.12.4", default-features = false, features = ["aws", "tls-webpki-roots"] }
ply-rs = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
sha1 = "0.10"
stl_io = "0.8"
subtle = "2.6"
tar = "0.4.46"
tempfile = "3.15"
thiserror = "2.0"
tiny-skia = "0.12"
tobj = "4.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-full", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wait-timeout = "0.2.1"
wgpu = "0.20.1"
zstd = "0.13"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
