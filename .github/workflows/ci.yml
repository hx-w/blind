name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded branch/PR checks should not hold scarce macOS runners.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/native.yml
