name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runner: macos-15
          - os: Linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
          package-manager-cache: false
      - name: Install Linux runtime and integration-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers openssh-server
      - name: Build viewer
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
      - name: Verify viewer interactions
        working-directory: web
        run: |
          npx playwright install chromium
          npm run test:browser
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --locked --release
      - name: Verify CLI
        run: |
          ./target/release/blind --version
          ./target/release/blind join --help
          ./target/release/blind --help
          ./target/release/blind doctor --help
          ./target/release/blind share --help
          ./target/release/blind update --help
      - name: Verify Client and read-only SFTP
        run: python3 tests/integration_sftp.py target/release
      - name: Verify read-only OSS sources
        run: python3 tests/integration_oss.py target/release
      - name: Verify Server plugins
        run: python3 tests/integration_plugins.py target/release
