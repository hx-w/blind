name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Replace stale PR checks, but let main finish populating release caches.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/native.yml
