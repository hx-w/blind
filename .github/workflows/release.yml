name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate stable release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" Cargo.toml
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
          package-manager-cache: false
      - name: Build viewer
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Verify source
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build binary
        run: cargo build --locked --release
      - name: Package
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          ./target/release/blind --version
          ./target/release/blind update --help
          mkdir package
          cp target/release/blind package/blind
          chmod 0755 package/blind
          tar -C package -czf "blind-${{ matrix.target }}.tar.gz" blind
      - uses: actions/upload-artifact@v7
        with:
          name: blind-${{ matrix.target }}
          path: blind-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum blind-*.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/blind-*.tar.gz release/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --title "Blind $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
