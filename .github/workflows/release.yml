name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native.yml
    with:
      release: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: blind-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum blind-*.tar.gz > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/blind-*.tar.gz release/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --title "Blind $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
